name: Build Core Bootstrap

on:
  workflow_dispatch:
    inputs:
      lfs_release:
        description: Stable LFS release number, or latest
        required: false
        default: latest
        type: string
      force_rebuild:
        description: Rebuild even when this release is already cached
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  LFS_BUNDLE_INDEX: "https://ftp.lfs-matrix.net/pub/lfs/lfs-packages/"
  LFS_BUNDLE_BASE_URL: "https://ftp.lfs-matrix.net/pub/lfs/lfs-packages"

jobs:
  build-core-bootstrap:
    name: Build only-core bootstrap repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect latest stable LFS release
        id: lfs-release
        env:
          REQUESTED_RELEASE: ${{ inputs.lfs_release || 'latest' }}
        run: |
          release="$(python3 scripts/detect_lfs_release.py)"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "LFS_RELEASE=${release}" >> "$GITHUB_ENV"
          echo "Selected LFS ${release}"

      - name: Look up LFS source bundle cache
        id: lfs-source-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/lfs/lfs-packages-${{ steps.lfs-release.outputs.release }}.tar
            .cache/lfs/MD5SUMS
          key: lfs-source-bundle-${{ steps.lfs-release.outputs.release }}-v1
          lookup-only: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_rebuild == false) }}

      - name: Decide whether this release needs a build
        id: build-decision
        env:
          CACHE_HIT: ${{ steps.lfs-source-cache.outputs.cache-hit }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
        run: |
          build=true

          if [[ "${CACHE_HIT}" == "true" ]]; then
            if [[ "${EVENT_NAME}" == "schedule" ]]; then
              build=false
            elif [[ "${EVENT_NAME}" == "workflow_dispatch" && "${FORCE_REBUILD}" != "true" ]]; then
              build=false
            fi
          fi

          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "Build required: ${build}"

      - name: Import selected LFS package metadata
        if: steps.build-decision.outputs.build == 'true'
        run: python3 scripts/import_lfs.py

      - name: Download, verify, and extract LFS source bundle
        if: steps.build-decision.outputs.build == 'true'
        run: bash scripts/prepare_lfs_sources.sh

      - name: Validate package versions and bundled sources
        if: steps.build-decision.outputs.build == 'true'
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected_release = os.environ["LFS_RELEASE"]
          manifest = json.loads(Path("manifests/lfs-packages.json").read_text())
          if manifest.get("release") != expected_release:
              raise SystemExit(
                  f"Unexpected LFS release: {manifest.get('release')}"
              )

          lfs_packages = {
              package["source_name"]: package
              for package in manifest["packages"]
          }
          bundled_files = {
              path.name
              for path in Path(".cache/lfs/sources").rglob("*")
              if path.is_file()
          }

          packages = {
              "zlib": "zlib",
              "xz": "xz",
              "zstd": "zstd",
              "bzip2": "bzip2",
              "ncurses": "ncurses",
              "readline": "readline",
              "bash": "bash",
              "m4": "m4",
              "file": "file",
              "diffutils": "diffutils",
              "coreutils": "coreutils",
              "sed": "sed",
              "grep": "grep",
              "gawk": "gawk",
              "findutils": "findutils",
              "gzip": "gzip",
              "make": "make",
              "patch": "patch",
              "tar": "tar",
              "attr": "attr",
              "acl": "acl",
              "libcap": "libcap",
              "libxcrypt": "libxcrypt",
              "gmp": "gmp",
              "mpfr": "mpfr",
              "mpc": "mpc",
              "bison": "bison",
              "flex": "flex",
              "bc": "bc",
              "pkgconf": "pkgconf",
              "binutils": "binutils",
              "gperf": "gperf",
              "libffi": "libffi",
              "iana-etc": "iana-etc",
              "psmisc": "psmisc",
              "less": "less",
              "libpipeline": "libpipeline",
              "man-pages": "man-pages",
              "gettext": "gettext",
              "gdbm": "gdbm",
              "groff": "groff",
              "texinfo": "texinfo",
              "procps-ng": "procps-ng",
              "inetutils": "inetutils",
              "iproute2": "iproute2",
          }

          for package_name, lfs_name in packages.items():
              pkgbuild = Path(
                  f"packages/core/{package_name}/PKGBUILD"
              ).read_text()
              match = re.search(
                  r"^pkgver=(.+)$",
                  pkgbuild,
                  re.MULTILINE,
              )
              if match is None:
                  raise SystemExit(
                      f"{package_name}: PKGBUILD does not define pkgver"
                  )

              recipe_version = match.group(1).strip()
              lfs_package = lfs_packages.get(lfs_name)
              if lfs_package is None:
                  raise SystemExit(
                      f"{package_name}: missing from LFS metadata"
                  )

              lfs_version = lfs_package["version"]
              if recipe_version != lfs_version:
                  raise SystemExit(
                      f"{package_name}: version mismatch: "
                      f"PKGBUILD={recipe_version}, LFS={lfs_version}"
                  )

              filename = lfs_package["filename"]
              if filename not in bundled_files:
                  raise SystemExit(
                      f"{package_name}: {filename} is missing from "
                      "the LFS source bundle"
                  )

              print(
                  f"{package_name}: {recipe_version} "
                  f"(matches LFS; bundled as {filename})"
              )
          PY

      - name: Verify sources and build packages in Arch Linux
        if: steps.build-decision.outputs.build == 'true'
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            archlinux:base-devel \
            bash /workspace/scripts/build_bootstrap.sh

      - name: Collect bootstrap packages
        if: steps.build-decision.outputs.build == 'true'
        run: |
          mkdir -p output/packages

          find packages/core \
            -mindepth 2 \
            -maxdepth 2 \
            -type f \
            -name "*.pkg.tar.zst" \
            -exec cp -v {} output/packages/ \;

          package_count="$(find output/packages -type f -name '*.pkg.tar.zst' | wc -l)"
          test "$package_count" -eq 46
          echo "Collected $package_count bootstrap packages"

      - name: Create only-core repository database
        if: steps.build-decision.outputs.build == 'true'
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/output/packages \
            archlinux:base-devel \
            bash -euxo pipefail -c '
              repo-add only-core.db.tar.zst ./*.pkg.tar.zst
            '

      - name: Upload Only Linux bootstrap repository
        if: steps.build-decision.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: only-core-bootstrap-${{ steps.lfs-release.outputs.release }}
          path: |
            output/packages/*.pkg.tar.zst
            output/packages/only-core.db*
            output/packages/only-core.files*
            manifests/lfs-packages.json
            config/release.yaml
            config/core-packages.yaml
            docs/PACKAGING_POLICY.md
          retention-days: 7
          if-no-files-found: error

      - name: Save verified LFS source bundle cache
        if: steps.build-decision.outputs.build == 'true' && steps.lfs-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/lfs/lfs-packages-${{ steps.lfs-release.outputs.release }}.tar
            .cache/lfs/MD5SUMS
          key: lfs-source-bundle-${{ steps.lfs-release.outputs.release }}-v1

      - name: Report unchanged LFS release
        if: steps.build-decision.outputs.build == 'false'
        run: |
          echo "LFS $LFS_RELEASE has already been processed."
          echo "No rebuild is needed."
