name: Build Core Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LFS_RELEASE: "13.0"
  LFS_BUNDLE_BASE_URL: "https://ftp.lfs-matrix.net/pub/lfs/lfs-packages"

jobs:
  build-core-bootstrap:
    name: Build only-core bootstrap repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Import LFS 13.0 package metadata
        run: python3 scripts/import_lfs.py

      - name: Restore LFS source bundle cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/lfs/lfs-packages-13.0.tar
            .cache/lfs/MD5SUMS
          key: lfs-source-bundle-13.0-v1

      - name: Download, verify, and extract LFS source bundle
        run: bash scripts/prepare_lfs_sources.sh

      - name: Validate package versions and bundled sources
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(Path("manifests/lfs-packages.json").read_text())
          if manifest.get("release") != "13.0":
              raise SystemExit(
                  f"Unexpected LFS release: {manifest.get('release')}"
              )

          lfs_packages = {
              package["source_name"]: package
              for package in manifest["packages"]
          }
          bundled_files = {
              path.name
              for path in Path(".cache/lfs/sources").rglob("*")
              if path.is_file()
          }

          packages = {
              "zlib": "zlib",
              "xz": "xz",
              "zstd": "zstd",
              "bzip2": "bzip2",
              "ncurses": "ncurses",
              "readline": "readline",
              "bash": "bash",
              "m4": "m4",
              "file": "file",
              "diffutils": "diffutils",
              "coreutils": "coreutils",
              "sed": "sed",
              "grep": "grep",
              "gawk": "gawk",
              "findutils": "findutils",
              "gzip": "gzip",
              "make": "make",
              "patch": "patch",
              "tar": "tar",
              "attr": "attr",
              "acl": "acl",
              "libcap": "libcap",
              "libxcrypt": "libxcrypt",
          }

          for package_name, lfs_name in packages.items():
              pkgbuild = Path(
                  f"packages/core/{package_name}/PKGBUILD"
              ).read_text()
              match = re.search(
                  r"^pkgver=(.+)$",
                  pkgbuild,
                  re.MULTILINE,
              )
              if match is None:
                  raise SystemExit(
                      f"{package_name}: PKGBUILD does not define pkgver"
                  )

              recipe_version = match.group(1).strip()
              lfs_package = lfs_packages.get(lfs_name)
              if lfs_package is None:
                  raise SystemExit(
                      f"{package_name}: missing from LFS metadata"
                  )

              lfs_version = lfs_package["version"]
              if recipe_version != lfs_version:
                  raise SystemExit(
                      f"{package_name}: version mismatch: "
                      f"PKGBUILD={recipe_version}, LFS={lfs_version}"
                  )

              filename = lfs_package["filename"]
              if filename not in bundled_files:
                  raise SystemExit(
                      f"{package_name}: {filename} is missing from "
                      "the LFS source bundle"
                  )

              print(
                  f"{package_name}: {recipe_version} "
                  f"(matches LFS; bundled as {filename})"
              )
          PY

      - name: Verify sources and build packages in Arch Linux
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            archlinux:base-devel \
            bash /workspace/scripts/build_bootstrap.sh

      - name: Collect bootstrap packages
        run: |
          mkdir -p output/packages

          find packages/core \
            -mindepth 2 \
            -maxdepth 2 \
            -type f \
            -name "*.pkg.tar.zst" \
            -exec cp -v {} output/packages/ \;

          package_count="$(find output/packages -type f -name '*.pkg.tar.zst' | wc -l)"
          test "$package_count" -eq 24
          echo "Collected $package_count bootstrap packages"

      - name: Create only-core repository database
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/output/packages \
            archlinux:base-devel \
            bash -euxo pipefail -c '
              repo-add only-core.db.tar.zst ./*.pkg.tar.zst
            '

      - name: Upload Only Linux bootstrap repository
        uses: actions/upload-artifact@v7
        with:
          name: only-core-bootstrap
          path: |
            output/packages/*.pkg.tar.zst
            output/packages/only-core.db*
            output/packages/only-core.files*
            manifests/lfs-packages.json
            config/release.yaml
            config/core-packages.yaml
            docs/PACKAGING_POLICY.md
          retention-days: 7
          if-no-files-found: error
