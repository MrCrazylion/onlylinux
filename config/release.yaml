distribution:
  name: "Only Linux"
  id: "onlylinux"
  release: "0.1-dev"
  architecture: "x86_64"

desktop:
  official: "GNOME"

package_manager:
  name: "Tatami"
  backend: "libalpm"

version_sources:
  core: "latest stable LFS systemd release"
  desktop: "upstream stable"
  applications: "upstream stable"

lfs:
  channel: "stable-systemd"
  release_detection:
    bundle_index: "https://ftp.lfs-matrix.net/pub/lfs/lfs-packages/"
    stable_bundle_pattern: "lfs-packages-<version>.tar"
  metadata_template: "https://www.linuxfromscratch.org/lfs/downloads/<version>-systemd"
  source_bundle_template: "https://ftp.lfs-matrix.net/pub/lfs/lfs-packages/lfs-packages-<version>.tar"
  bundle_checksums: "https://ftp.lfs-matrix.net/pub/lfs/lfs-packages/MD5SUMS"

repositories:
  - only-core
  - only-desktop
  - only-apps
