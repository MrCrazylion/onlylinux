distribution:
  name: "Only Linux"
  id: "onlylinux"
  release: "0.1-dev"
  architecture: "x86_64"

desktop:
  official: "GNOME"

package_manager:
  name: "Tatami"
  backend: "libalpm"

version_sources:
  core: "LFS 13.0-systemd"
  desktop: "upstream stable"
  applications: "upstream stable"

lfs:
  release: "13.0"
  metadata: "https://www.linuxfromscratch.org/lfs/downloads/13.0"
  source_bundle:
    url: "https://ftp.lfs-matrix.net/pub/lfs/lfs-packages/lfs-packages-13.0.tar"
    checksums: "https://ftp.lfs-matrix.net/pub/lfs/lfs-packages/MD5SUMS"

repositories:
  - only-core
  - only-desktop
  - only-apps
